<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button onclick="start()">Mulai</button>
    <button onclick="stop()">Berhenti</button>

    <p id="output"></p>

    <script>
      let mulaiWaktu;

      function start() {
        mulaiWaktu = Date.now();
        document.getElementById("output").innerText = "Stopwatch dimulai....";
      }
      function stop() {
        let selesaiWaktu = Date.now();
        let durasi = selesaiWaktu - mulaiWaktu;
        document.getElementById("output").innerText = `Durasi : ${
          durasi / 1000
        } detik`;
      }
    </script>
  </body>
</html>
